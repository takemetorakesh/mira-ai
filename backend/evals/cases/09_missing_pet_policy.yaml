name: 'Unknown policy: pets at a property with no pet policy'
covers: [tool_selection, hallucination]
turns:
  - user: Do you allow dogs at Sossego Retreat in Goa?
    expect:
      tools_called: [get_policy]
      reply_mentions_any: ["don't have", "do not have", "not sure", "check with", "no information", "don't know", "can't confirm"]
      reply_excludes: ["yes, dogs", "yes, pets", "dogs are welcome", "pets are welcome", "dogs aren't allowed", "pets aren't allowed", "no pets"]
      next_action: [handoff_to_staff, answer_question]
